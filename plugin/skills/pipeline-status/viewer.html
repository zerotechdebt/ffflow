<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline status</title>
<!--
  pipeline-status viewer. Self-contained: no network, no build.
  `pipeline.py --format html` replaces the placeholder in #pipeline-data with the model.
  Opened as-is, it asks for a pipeline-status JSON file (schema_version 1) instead.
  Views are addressed by the URL hash: #/overview, #/root/<slug>, #/unattached, #/findings, #/epics.
-->
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --raised: #ffffff;
  --line: #e4e3df;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --st-done: #0ca30c;
  --st-progress: #2a78d6;
  --st-unknown: #fab219;
  --st-idle: #898781;
  --track: #e4e3df;
  --select: #ecebe7;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raised: #232321; --line: #33332f;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --st-progress: #3987e5; --track: #33332f; --select: #2c2c29;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raised: #232321; --line: #33332f;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
  --st-progress: #3987e5; --track: #33332f; --select: #2c2c29;
}

* { box-sizing: border-box; }
body { margin: 0; }
/* The page behind the viewer matches its plane, so scrolled views have no bare edge. */
html { background: #f9f9f7; }
@media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0d0d0d; } }
html[data-theme="dark"] { background: #0d0d0d; }
.viz-root {
  min-height: 100vh; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; text-decoration-color: var(--ink-3); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--ink); }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0; }
h3 { font-size: 13px; margin: 0; color: var(--ink-2); font-weight: 600; }
.muted { color: var(--ink-3); }
.sub { color: var(--ink-2); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
button, select {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--raised);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
label.check { text-transform: none; letter-spacing: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); cursor: pointer; }

/* Shell: left nav + main */
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
nav.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 10px;
}
.brand { padding: 0 8px 12px; }
.brand .repo { font-weight: 600; font-size: 15px; }
.brand .when { font-size: 11px; color: var(--ink-3); }
.nav-section { margin-top: 14px; }
.nav-head { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.nav-item {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 13px;
}
.nav-item:hover { background: var(--select); }
.nav-item[aria-current="page"] { background: var(--select); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
.nav-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav-item .tag { font-size: 10px; text-transform: uppercase; color: var(--ink-3); margin-left: 4px; font-weight: 400; }
.nav-glyph { width: 16px; text-align: center; color: var(--ink-3); }
.nav-root { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: start; }
.caret { border: 0; background: none; padding: 10px 0 0; width: 16px; color: var(--ink-2); font-size: 13px; line-height: 1; cursor: pointer; border-radius: 4px; }
.caret:hover { color: var(--ink); }
.chev { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform .12s; }
.caret[aria-expanded="true"] .chev { transform: translateY(-2px) rotate(45deg); }
.nav-phases { grid-column: 2; list-style: none; margin: 0 0 6px 16px; padding: 0 0 0 6px; border-left: 1px solid var(--line); }
.nav-phase {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: center;
  padding: 3px 6px; border-radius: 5px; font-size: 12px; text-decoration: none; color: var(--ink-2);
}
.nav-phase:hover { background: var(--select); }
.nav-phase[aria-current] { background: var(--select); color: var(--ink); }
.nav-phase.is-now { color: var(--ink); font-weight: 600; }
.nav-phase .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-phase .pn { color: var(--ink-3); font-weight: 400; }
.nav-phase .pill .icon { width: 12px; height: 12px; font-size: 7px; }
.nav-phase .count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.marker { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--ink); border: 1px solid var(--st-progress); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
.marker.next { border-style: dashed; }
.nav-foot { margin-top: auto; padding: 14px 8px 0; display: flex; flex-wrap: wrap; gap: 8px; }

main { padding: 24px clamp(16px, 3vw, 40px) 48px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 6px; }
.page-meta { font-size: 12px; color: var(--ink-3); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.head-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; text-decoration: none; color: inherit; display: block; }
a.tile:hover { border-color: var(--ink-3); }
.tile .label { font-size: 12px; color: var(--ink-2); }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile .detail { font-size: 12px; color: var(--ink-3); }

.section { margin: 22px 0 10px; }
.banner { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--st-unknown); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

/* Overview: one card per root */
.root-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
a.root-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 8px; }
a.root-card:hover { border-color: var(--ink-3); }
.root-card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.root-card .from { font-size: 12px; color: var(--ink-3); }

/* PRDs */
.with-aside { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.aside-note { font-size: 12px; color: var(--ink-3); margin: 2px 0 8px; }
.increments { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.increments li { font-size: 13px; }
.increments .iname { font-weight: 600; }
.size { display: inline-block; min-width: 22px; text-align: center; font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 6px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 20px; }
.fact .label { font-size: 12px; color: var(--ink-3); }
.fact .value { font-size: 14px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 3px 0; }
.nav-sub { grid-column: 2; list-style: none; margin: 0 0 6px 16px; padding: 0 0 0 6px; border-left: 1px solid var(--line); }
.nav-empty { font-size: 12px; color: var(--ink-3); font-style: italic; padding: 3px 6px; }
.strip { display: flex; gap: 3px; }
.strip span { flex: 1; height: 8px; border-radius: 2px; background: var(--c); }
.strip span.idle { background: transparent; border: 1.5px solid var(--c); }

/* Root detail: phases top to bottom */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.phase {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--st-idle));
  border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 12px;
}
.phase.is-next { outline: 2px dashed var(--st-progress); outline-offset: 2px; }
.phase.is-selected { box-shadow: 0 0 0 2px var(--ink-3); scroll-margin-top: 16px; }
.phase .pnum { font-size: 18px; font-weight: 600; color: var(--ink-3); grid-row: span 3; }
.phase .ptitle { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-weight: 600; }
.deps { font-size: 12px; color: var(--ink-3); }
.empty { font-size: 12px; color: var(--ink-3); font-style: italic; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 400; color: var(--ink); white-space: nowrap; }
.pill .icon { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--c); flex: none; }
.pill.idle .icon { background: transparent; border: 1.5px solid var(--c); color: var(--c); }
.pill.unknown .icon { color: #0b0b0b; }
.pill.bare { gap: 0; }
.badge-next { font-size: 11px; font-weight: 600; color: var(--ink); border: 1px dashed var(--st-progress); border-radius: 4px; padding: 0 5px; }

.epic-rows { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.epic-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
.epic-row:first-child { border-top: 0; }
.epic-row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.epic-row .num { font-weight: 600; }
.prs { display: flex; gap: 6px; font-size: 12px; }

.meter { --w: 0%; position: relative; width: 90px; height: 6px; border-radius: 3px; background: var(--track); flex: none; overflow: hidden; display: inline-block; }
.meter::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--c, var(--st-progress)); border-radius: 3px; }
.meter.wide { width: 160px; }
.count { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; }
.with-meter { display: inline-flex; align-items: center; gap: 8px; }

.finding { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 13px; padding: 4px 0; }
.sev { font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 0 5px; align-self: start; margin-top: 2px; }
.sev.warn { background: var(--st-unknown); color: #0b0b0b; }
.sev.info { border: 1px solid var(--line); color: var(--ink-2); }
.group-title { font-size: 12px; color: var(--ink-2); margin: 12px 0 2px; font-weight: 600; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
td.n { font-variant-numeric: tabular-nums; }

.loader { max-width: 520px; margin: 12vh auto; text-align: center; background: var(--surface); border: 2px dashed var(--line); border-radius: 12px; padding: 32px; }
.loader.drag { border-color: var(--st-progress); }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .epic-row { grid-template-columns: 56px minmax(0, 1fr); }
  .with-aside { grid-template-columns: 1fr; }
}
@media (forced-colors: active) {
  .pill .icon, .sev.warn, .strip span { forced-color-adjust: none; border: 1px solid CanvasText; }
  .meter::after { background: CanvasText; }
}
</style>
</head>
<body>
<div class="viz-root" id="app"></div>

<script id="pipeline-data" type="application/json">__PIPELINE_JSON__</script>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  let model = null;

  // Status vocabulary: color + icon + label, never color alone.
  const STATUS = {
    done:        { label: "done",        icon: "✓", c: "var(--st-done)",     cls: "" },
    in_progress: { label: "in progress", icon: "▶", c: "var(--st-progress)", cls: "" },
    captured:    { label: "captured",    icon: "",  c: "var(--st-idle)",     cls: "idle" },
    not_started: { label: "not started", icon: "",  c: "var(--st-idle)",     cls: "idle" },
    unknown:     { label: "unknown",     icon: "?", c: "var(--st-unknown)",  cls: "unknown" },
  };
  const st = (s) => STATUS[s] || STATUS.unknown;

  // PRD stages: negotiation (from state.json), then delivery (from the roadmaps that cite it).
  const STAGE = {
    drafting:   { label: "drafting",   icon: "",  c: "var(--st-idle)",     cls: "idle" },
    converged:  { label: "converged",  icon: "=", c: "var(--st-progress)", cls: "idle" },
    ratified:   { label: "ratified",   icon: "✓", c: "var(--st-progress)", cls: "idle" },
    planned:    { label: "planned",    icon: "",  c: "var(--st-progress)", cls: "idle" },
    delivering: { label: "delivering", icon: "▶", c: "var(--st-progress)", cls: "" },
    delivered:  { label: "delivered",  icon: "✓", c: "var(--st-done)",     cls: "" },
    unknown:    { label: "unknown",    icon: "?", c: "var(--st-unknown)",  cls: "unknown" },
  };
  const sg = (s) => STAGE[s] || STAGE.unknown;

  // DOM helper: text is always set via text nodes, never parsed as HTML.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") for (const [p, val] of Object.entries(v)) el.style.setProperty(p, val);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }

  const pill = (status, opts = {}) => {
    const s = opts.spec || st(status);
    return h("span", { class: `pill ${s.cls}${opts.bare ? " bare" : ""}`, style: { "--c": s.c }, title: opts.title || s.label },
      h("span", { class: "icon", "aria-hidden": opts.bare ? null : "true" }, s.icon),
      opts.bare ? h("span", { class: "sr", style: { position: "absolute", width: "1px", height: "1px", overflow: "hidden", clip: "rect(0 0 0 0)" } }, s.label) : s.label);
  };

  const meter = (done, total, wide) => {
    const pct = total ? Math.round((100 * done) / total) : 0;
    const c = total && done === total ? "var(--st-done)" : "var(--st-progress)";
    return h("span", { class: `meter${wide ? " wide" : ""}`, role: "meter", "aria-valuemin": 0,
      "aria-valuemax": total, "aria-valuenow": done, "aria-label": `${done} of ${total} tasks closed`,
      title: `${done} of ${total} tasks closed`, style: { "--w": `${pct}%`, "--c": c } });
  };

  const stagePill = (stage, opts = {}) => pill(stage, { ...opts, spec: sg(stage) });

  const ext = (href, text, title) => (href ? h("a", { href, target: "_blank", rel: "noopener", title }, text) : h("span", { title }, text));

  // ---------------------------------------------------------------- routing

  const route = () => {
    const parts = (location.hash.replace(/^#\/?/, "") || "overview").split("/").map(decodeURIComponent);
    return { view: parts[0], arg: parts[1], sub: parts[2] };
  };
  const href = (view, arg, sub) => `#/${view}${arg ? `/${encodeURIComponent(arg)}` : ""}${sub != null ? `/${sub}` : ""}`;

  // ---------------------------------------------------------------- shared pieces

  function ctx(m) {
    const epics = new Map(m.epics.map((e) => [e.number, e]));
    const repoUrl = m.repo ? `https://github.com/${m.repo}` : null;
    const prUrl = (n) => (repoUrl ? `${repoUrl}/pull/${n}` : null);
    const warns = m.findings.filter((f) => f.severity === "warn");
    const loose = m.epics.filter((e) => e.root == null);
    const prds = new Map((m.prds || []).map((p) => [p.slug, p]));
    const roots = new Map(m.roots.map((r) => [r.slug, r]));
    return { epics, prUrl, warns, loose, prds, roots };
  }

  function epicRow(c, n) {
    const e = c.epics.get(n);
    if (!e) return h("div", { class: "epic-row" }, `#${n}`);
    return h("div", { class: "epic-row" },
      ext(e.url, h("span", { class: "num" }, `#${e.number}`), "open in tracker"),
      h("span", { class: "title", title: e.title }, e.title.replace(/^Epic:\s*/, "")),
      h("span", { class: "with-meter" }, meter(e.tasks.closed, e.tasks.total), h("span", { class: "count" }, `${e.tasks.closed}/${e.tasks.total}`)),
      pill(e.status),
      h("span", { class: "prs" }, ...e.open_pulls.map((p) => ext(c.prUrl(p), `PR #${p}`, "open pull request"))));
  }

  function findingList(fs) {
    const byCode = new Map();
    for (const f of [...fs].sort((a, b) => (a.severity === b.severity ? 0 : a.severity === "warn" ? -1 : 1))) {
      if (!byCode.has(f.code)) byCode.set(f.code, []);
      byCode.get(f.code).push(f);
    }
    return [...byCode].map(([code, list]) => h("div", {},
      h("div", { class: "group-title" }, `${code} (${list.length})`),
      ...list.map((f) => h("div", { class: "finding" }, h("span", { class: `sev ${f.severity}` }, f.severity), h("span", {}, f.message)))));
  }

  const rootProgress = (r, wide) => {
    const p = r.progress || {};
    if (!p.tasks_total) return null;
    return h("span", { class: "head-progress" }, meter(p.tasks_closed, p.tasks_total, wide),
      `${p.tasks_closed}/${p.tasks_total} tasks${p.phases_total ? ` · ${p.phases_done}/${p.phases_total} phases` : ""}`);
  };

  // ---------------------------------------------------------------- nav

  function nav(m, c, cur) {
    const hideDone = sessionStorage.getItem("pipeline:hideDone") === "1";
    const item = (view, arg, glyph, name, count, title) => h("a", {
      class: "nav-item", href: href(view, arg), title,
      "aria-current": cur.view === view && (cur.arg || null) === (arg || null) ? "page" : null,
    }, glyph, name, h("span", { class: "count" }, count ?? ""));

    const roots = m.roots.filter((r) => !(hideDone && r.status === "done"));
    // Unfinished roadmaps start expanded, finished ones collapsed; a click is remembered per root.
    const isOpen = (r) => {
      const saved = localStorage.getItem(`pipeline:open:${r.slug}`);
      return saved == null ? r.status !== "done" : saved === "1";
    };
    const themeSel = h("select", { "aria-label": "Theme", onchange: (ev) => {
      const v = ev.target.value;
      if (v === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", v);
      localStorage.setItem("pipeline:theme", v);
    } }, ...["auto", "light", "dark"].map((v) => h("option", { value: v }, `Theme: ${v}`)));
    themeSel.value = document.documentElement.getAttribute("data-theme") || "auto";

    return h("nav", { class: "side", "aria-label": "Pipeline" },
      h("div", { class: "brand" },
        h("div", { class: "repo" }, m.repo || "Pipeline"),
        h("div", { class: "when" }, `${m.default_ref} · ${m.generated_at || "?"}`)),
      item("overview", null, h("span", { class: "nav-glyph" }, "◎"), "Overview"),
      // PRDs appear only when the repository has PRD bundles.
      (m.prds || []).length ? h("div", { class: "nav-section" },
        h("div", { class: "nav-head" }, `PRDs (${m.prds.length})`),
        m.prds.map((p) => {
          const marker = p.ready_for_planning ? h("span", { class: "marker next" }, "ready")
            : p.stage === "drafting" && p.state.round ? `R${p.state.round}/${p.state.round_cap}` : "";
          const link = item("prd", p.slug, stagePill(p.stage, { bare: true }), h("span", { class: "name" }, p.slug), marker,
            `${p.title || p.slug}: ${sg(p.stage).label}`);
          const key = `pipeline:open:prd:${p.slug}`;
          const saved = localStorage.getItem(key);
          const open = saved == null ? p.roots.length > 0 && p.stage !== "delivered" : saved === "1";
          const caret = h("button", { class: "caret", "aria-expanded": String(open),
            "aria-label": `${open ? "Collapse" : "Expand"} roadmaps for ${p.slug}`, title: open ? "Hide roadmaps" : "Show roadmaps",
            onclick: () => { localStorage.setItem(key, open ? "0" : "1"); draw(); } }, h("span", { class: "chev", "aria-hidden": "true" }));
          const sub = open ? h("ol", { class: "nav-sub", "aria-label": `roadmaps from ${p.slug}` },
            p.roots.length ? p.roots.map((slug) => {
              const r = c.roots.get(slug);
              return h("li", {}, h("a", { class: "nav-phase", href: href("root", slug) },
                pill(r ? r.status : "unknown", { bare: true }), h("span", { class: "name" }, slug),
                h("span", { class: "count" }, r && r.progress.tasks_total ? `${r.progress.tasks_closed}/${r.progress.tasks_total}` : "")));
            }) : h("li", { class: "nav-empty" }, "no roadmap yet")) : null;
          return h("div", { class: "nav-root" }, caret, link, sub);
        })) : null,
      h("div", { class: "nav-section" },
        h("div", { class: "nav-head" }, `Roadmaps & plans (${m.roots.length})`,
          h("label", { class: "check", title: "Hide roots that are done" },
            h("input", { type: "checkbox", checked: hideDone, onchange: (ev) => {
              sessionStorage.setItem("pipeline:hideDone", ev.target.checked ? "1" : "0"); draw();
            } }), "hide done")),
        ...roots.map((r) => {
          const p = r.progress || {};
          const link = item("root", r.slug, pill(r.status, { bare: true }),
            h("span", { class: "name" }, r.slug, r.kind !== "roadmap" ? h("span", { class: "tag" }, r.kind) : null),
            p.tasks_total ? `${p.tasks_closed}/${p.tasks_total}` : "", `${r.slug}: ${st(r.status).label}`);
          if (!r.phases.length) return h("div", { class: "nav-root" }, h("span", {}), link);
          const open = isOpen(r);
          const caret = h("button", { class: "caret", "aria-expanded": String(open),
            "aria-label": `${open ? "Collapse" : "Expand"} ${r.slug} phases`, title: open ? "Hide phases" : "Show phases",
            onclick: () => { localStorage.setItem(`pipeline:open:${r.slug}`, open ? "0" : "1"); draw(); } }, h("span", { class: "chev", "aria-hidden": "true" }));
          const phases = open ? h("ol", { class: "nav-phases", "aria-label": `${r.slug} phases` }, ...r.phases.map((ph) => {
            const [done, total] = ph.epics.reduce(([d, t], n) => {
              const e = c.epics.get(n);
              return e ? [d + e.tasks.closed, t + e.tasks.total] : [d, t];
            }, [0, 0]);
            const marker = ph.status === "in_progress" ? "now" : ph.next ? "next" : null;
            const selected = cur.view === "root" && cur.arg === r.slug && cur.sub === String(ph.number);
            return h("li", {}, h("a", {
              class: `nav-phase${marker === "now" ? " is-now" : ""}`, href: href("root", r.slug, ph.number),
              "aria-current": selected ? "location" : null, title: `P${ph.number} ${ph.title || ""}: ${st(ph.status).label}`,
            }, pill(ph.status, { bare: true }),
              h("span", { class: "name" }, h("span", { class: "pn" }, `P${ph.number} `), ph.title || "(untitled)"),
              h("span", { class: "count" }, total ? `${done}/${total}` : "", marker ? h("span", { class: `marker ${marker}` }, marker) : null)));
          })) : null;
          return h("div", { class: "nav-root" }, caret, link, phases);
        }),
        roots.length < m.roots.length ? h("div", { class: "nav-head", style: { "text-transform": "none" } }, `${m.roots.length - roots.length} done hidden`) : null),
      h("div", { class: "nav-section" },
        h("div", { class: "nav-head" }, "Catch-all"),
        item("unattached", null, h("span", { class: "nav-glyph" }, "⋯"), "Unattached work", c.loose.length + m.unlinked_open_issues.length,
          "epics with no plan root, and open issues outside every epic"),
        item("findings", null, h("span", { class: "nav-glyph" }, "!"), "Data gaps", c.warns.length, "findings about the plan/tracker trail"),
        item("epics", null, h("span", { class: "nav-glyph" }, "≡"), "All epics", m.epics.length, "table of every epic")),
      h("div", { class: "nav-foot" }, themeSel, h("button", { onclick: showLoader }, "Load JSON…")));
  }

  // ---------------------------------------------------------------- views

  function viewOverview(m, c) {
    const s = m.summary;
    const tile = (label, value, detail, link) => h(link ? "a" : "div", { class: "tile", href: link },
      h("div", { class: "label" }, label), h("div", { class: "value" }, value), h("div", { class: "detail" }, detail));
    const inFlight = m.epics.filter((e) => e.status === "in_progress");
    return [
      h("div", { class: "page-head" }, h("h1", {}, "Overview")),
      h("div", { class: "page-meta" }, `${m.refs_scanned.length} refs scanned · tracker ${m.tracker.backend || "?"}${m.tracker.ok ? "" : " (unavailable)"}`),
      h("div", { class: "tiles" },
        s.prds ? tile("PRDs", s.prds, (s.ready_for_planning || []).length ? `${s.ready_for_planning.length} ready for planning` : `${s.roots_without_prd ?? 0} roots have no PRD`) : null,
        tile("Roadmaps & plans", s.roots, `${s.roots_done} done · ${s.roots_in_progress} in progress`),
        tile("Epics", s.epics, `${s.epics_done} done · ${s.epics_in_progress} in progress`, href("epics")),
        tile("Next up", s.next.length, s.next.length ? s.next.map((x) => `${x.root} P${x.phase}`).join(", ") : "nothing unblocked"),
        tile("Unattached", s.epics_unlinked + s.unlinked_open_issues, `${s.epics_unlinked} epics · ${s.unlinked_open_issues} issues`, href("unattached")),
        tile("Data gaps", c.warns.length, `warnings · plus ${m.findings.length - c.warns.length} info`, href("findings"))),
      inFlight.length ? h("div", {},
        h("h3", { class: "section" }, `In flight (${inFlight.length})`),
        h("div", { class: "card" }, h("div", { class: "epic-rows" }, ...inFlight.map((e) => {
          const row = epicRow(c, e.number);
          if (e.root) row.children[1].append(h("span", { class: "muted" }, " · "), h("a", { href: href("root", e.root) }, e.root));
          return row;
        })))) : null,
      h("h3", { class: "section" }, "Roadmaps & plans"),
      h("div", { class: "root-cards" }, ...m.roots.map(rootCard))];
  }

  function rootCard(r) {
    return h("a", { class: "card root-card", href: href("root", r.slug) },
      h("div", { class: "top" }, h("h2", {}, r.slug), pill(r.status)),
      r.phases.length ? h("div", { class: "strip", "aria-label": "phases" }, ...r.phases.map((p) => {
        const s2 = st(p.status);
        return h("span", { class: s2.cls === "idle" ? "idle" : "", style: { "--c": s2.c }, title: `P${p.number} ${p.title || ""}: ${s2.label}` });
      })) : null,
      rootProgress(r) || h("span", { class: "muted", style: { "font-size": "12px" } },
        r.kind === "missing" ? "plan root not found" : r.status === "unknown" ? "status unknown · see data gaps" : "nothing captured"),
      r.kind === "external" ? h("span", { class: "from" }, `roadmap in ${r.repo}`) : null,
      (r.prds || []).length ? h("span", { class: "from" }, `from PRD ${r.prds.join(", ")}`) : null);
  }

  function increments(p) {
    return p.increments.length ? h("ol", { class: "increments" }, ...p.increments.map((i) => h("li", {},
      h("span", { class: "size", title: "relative size" }, i.size || "–"), h("span", { class: "iname" }, i.name),
      i.text ? h("div", { class: "muted", style: { "font-size": "12px", "margin-left": "34px" } }, i.text) : null)))
      : h("p", { class: "empty" }, "No increments listed.");
  }

  function viewPrd(m, c, slug) {
    const p = c.prds.get(slug);
    if (!p) return [h("h1", {}, "Not found"), h("p", { class: "sub" }, `No PRD named ${slug}.`)];
    const s = p.state || {};
    const signoff = s.signoff ? Object.entries(s.signoff).map(([seat, v]) => `${seat}: ${v == null ? "—" : v}`).join(" · ") : "—";
    const q = p.questions;
    const fs = m.findings.filter((f) => f.subject.type === "prd" && f.subject.path === p.path);
    const fact = (label, value) => h("div", { class: "fact" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value));
    return [
      h("div", { class: "page-head" }, h("h1", {}, p.title || p.slug), h("span", { class: "kind" }, "PRD"), stagePill(p.stage),
        p.ready_for_planning ? h("span", { class: "badge-next" }, "ready for planning") : null),
      h("div", { class: "page-meta" },
        h("span", { class: "mono" }, p.prd_file || p.path),
        p.on_default_ref ? null : h("span", {}, `read from ${p.found_on.join(", ")}`)),
      p.ready_for_planning ? h("div", { class: "banner" }, "No roadmap cites this PRD yet. It is the source for the next ", h("span", { class: "mono" }, "/fff:plan-roadmap"), ".") : null,
      h("h3", { class: "section" }, "Negotiation"),
      h("div", { class: "card facts" },
        fact("Status (state.json)", s.status || "—"),
        fact("Round", s.round ? `${s.round} of ${s.round_cap}` : "—"),
        fact("Next seat", s.next || "—"),
        fact("Sign-off", signoff),
        fact("Questions", `${q.open} open · ${q.answered} answered · ${q.deferred} deferred · ${q.dropped} dropped`),
        fact("Provisional values", p.provisional)),
      h("h3", { class: "section" }, `Roadmaps from this PRD (${p.roots.length})`),
      p.roots.length ? h("div", { class: "root-cards" }, ...p.roots.map((r) => c.roots.get(r)).filter(Boolean).map(rootCard))
        : h("p", { class: "empty" }, "None. A roadmap links here when its Source: line points into this bundle."),
      h("h3", { class: "section" }, "Outcomes"),
      p.outcomes.length ? h("div", { class: "card" }, h("ul", { class: "plain" }, ...p.outcomes.map((o) => h("li", {}, o)))) : h("p", { class: "empty" }, "None listed."),
      h("h3", { class: "section" }, `Metrics (${p.metrics.length})`),
      p.metrics.length ? h("div", { class: "card" }, h("table", {},
        h("thead", {}, h("tr", {}, ...["Metric", "Definition", "Source", "Baseline", "Target", "Now"].map((t) => h("th", {}, t)))),
        h("tbody", {}, ...p.metrics.map((x) => h("tr", {}, h("td", {}, x.metric), h("td", { class: "sub" }, x.definition),
          h("td", { class: "muted" }, x.source), h("td", {}, x.baseline), h("td", {}, x.target),
          h("td", { class: "muted", title: "nothing measures current values yet" }, "not measured"))))))
        : h("p", { class: "empty" }, "None listed."),
      h("h3", { class: "section" }, `Increments (${p.increments.length})`),
      h("div", { class: "card" }, increments(p)),
      p.planning_items.length ? [h("h3", { class: "section" }, `Parked for planning (${p.planning_items.length})`),
        h("div", { class: "card" }, h("ul", { class: "plain" }, ...p.planning_items.map((i) => h("li", {}, h("span", { class: "muted" }, `${i.id} `), i.item))))] : null,
      fs.length ? [h("h3", { class: "section" }, `Data gaps (${fs.length})`), h("div", { class: "card" }, ...findingList(fs))] : null,
    ];
  }

  function viewRoot(m, c, slug, sub) {
    const r = m.roots.find((x) => x.slug === slug);
    if (!r) return [h("h1", {}, "Not found"), h("p", { class: "sub" }, `No plan root named ${slug}.`)];
    const mine = new Set([...r.epics, ...r.phases.flatMap((p) => p.epics)]);
    const fs = m.findings.filter((f) => f.subject.slug === slug || (f.subject.type === "epic" && mine.has(f.subject.number)));

    const phases = r.phases.map((p) => {
      const s2 = st(p.status);
      const deps = p.depends_on.length || p.depends_on_issues.length
        ? `after ${[...p.depends_on.map((d) => `P${d}`), ...p.depends_on_issues.map((d) => `#${d}`)].join(", ")}${p.depends_inferred ? " (inferred from order)" : ""}`
        : "no dependencies";
      return h("li", { id: `phase-${p.number}`, class: `phase${p.next ? " is-next" : ""}${String(p.number) === sub ? " is-selected" : ""}`, style: { "--c": s2.c } },
        h("div", { class: "pnum" }, `P${p.number}`),
        h("div", { class: "ptitle" }, p.title || "(untitled)", pill(p.status),
          p.status_basis === "declared" ? h("span", { class: "muted", style: { "font-size": "12px", "font-weight": "400" } }, "declared in phase file") : null,
          p.next ? h("span", { class: "badge-next" }, "next") : null),
        h("div", { class: "deps", title: p.depends_on_text || "" }, deps, " · ", h("span", { class: "mono" }, p.path)),
        p.epics.length ? h("div", { class: "epic-rows" }, ...p.epics.map((n) => epicRow(c, n)))
          : (p.external_epics || []).length ? h("div", { class: "empty" }, "tracked in another repository: ",
              ...p.external_epics.flatMap((ref, i) => [i ? ", " : "", ext(`https://github.com/${ref.replace("#", "/issues/")}`, ref)]))
          : h("div", { class: "empty" }, p.status === "unknown" ? "cites epics the tracker doesn't have (see data gaps below)"
            : p.status_basis === "declared" ? "no epic; the phase file marks it done" : "not captured yet"));
    });

    return [
      h("div", { class: "page-head" }, h("h1", {}, r.slug), h("span", { class: "kind" }, r.kind), pill(r.status), rootProgress(r, true)),
      h("div", { class: "page-meta" },
        h("span", { class: "mono" }, r.path),
        r.source ? h("span", {}, "source: ", h("span", { class: "mono" }, r.source.text)) : null,
        r.on_default_ref ? null : h("span", {}, r.found_on.length ? `read from ${r.found_on.join(", ")}` : "not found on any scanned ref"),
        (r.prds || []).length ? h("span", {}, "from PRD ", ...r.prds.flatMap((x, i) => [i ? ", " : "", h("a", { href: href("prd", x) }, x)])) : null),
      r.kind === "missing" ? h("div", { class: "banner" }, "Epics cite this plan root, but no scanned branch or the working tree holds it.") : null,
      r.kind === "external" ? h("div", { class: "banner", style: { "border-left-color": "var(--st-progress)" } },
        "This roadmap lives in ", ext(r.url, r.repo), ". It is shown because epics in this repository cite it; its phases are not read.") : null,
      phases.length ? (() => {
        const list = [h("h3", { class: "section" }, `Phases (${r.phases.length})`), h("ol", { class: "timeline" }, ...phases)];
        const src = (r.prds || []).map((x) => c.prds.get(x)).filter((p) => p && p.increments.length);
        if (!src.length) return list;
        return h("div", { class: "with-aside" }, h("div", {}, list), h("aside", {}, ...src.map((p) => [
          h("h3", { class: "section" }, "Increments in ", h("a", { href: href("prd", p.slug) }, p.slug)),
          h("div", { class: "aside-note" }, "From the PRD; not linked to phases."),
          h("div", { class: "card" }, increments(p))])));
      })() : null,
      r.epics.length ? [h("h3", { class: "section" }, phases.length ? "Epics linked to the root" : `Epics (${r.epics.length})`),
        h("div", { class: "card" }, h("div", { class: "epic-rows" }, ...r.epics.map((n) => epicRow(c, n))))] : null,
      !phases.length && !r.epics.length ? h("p", { class: "empty" }, "Nothing linked to this plan root yet.") : null,
      fs.length ? [h("h3", { class: "section" }, `Data gaps for ${r.slug} (${fs.length})`), h("div", { class: "card" }, ...findingList(fs))] : null,
    ];
  }

  function viewUnattached(m, c) {
    return [
      h("div", { class: "page-head" }, h("h1", {}, "Unattached work")),
      h("div", { class: "page-meta" }, "Work the tracker knows about that no roadmap or plan accounts for."),
      h("h3", { class: "section" }, `Epics with no plan root (${c.loose.length})`),
      c.loose.length ? h("div", { class: "card" }, h("div", { class: "epic-rows" }, ...c.loose.map((e) => epicRow(c, e.number))))
        : h("p", { class: "empty" }, "None."),
      h("h3", { class: "section" }, `Open issues outside every epic (${m.unlinked_open_issues.length})`),
      m.unlinked_open_issues.length ? h("div", { class: "card" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "Issue"), h("th", {}, "Title"), h("th", {}, "Labels"))),
        h("tbody", {}, ...m.unlinked_open_issues.map((i) => h("tr", {},
          h("td", {}, ext(i.url, `#${i.number}`)), h("td", {}, i.title), h("td", { class: "muted" }, i.labels.join(", "))))))) : h("p", { class: "empty" }, "None."),
    ];
  }

  function viewFindings(m, c) {
    return [
      h("div", { class: "page-head" }, h("h1", {}, "Data gaps")),
      h("div", { class: "page-meta" }, `${c.warns.length} warnings, ${m.findings.length - c.warns.length} info. Gaps in the trail between plan files and the tracker; nothing here is fixed automatically.`),
      m.findings.length ? h("div", { class: "card" }, ...findingList(m.findings)) : h("p", { class: "empty" }, "None."),
    ];
  }

  function viewEpics(m) {
    return [
      h("div", { class: "page-head" }, h("h1", {}, "All epics")),
      h("div", { class: "card" }, h("table", {},
        h("thead", {}, h("tr", {}, ...["Epic", "Title", "Roadmap / plan", "Phase", "Status", "Tasks", "Open PRs"].map((t) => h("th", {}, t)))),
        h("tbody", {}, ...m.epics.map((e) => h("tr", {},
          h("td", {}, ext(e.url, `#${e.number}`)), h("td", {}, e.title),
          h("td", {}, e.root ? h("a", { href: href("root", e.root) }, e.root) : h("a", { href: href("unattached") }, "unattached")),
          h("td", { class: "n" }, e.phase ?? "—"), h("td", {}, pill(e.status)),
          h("td", { class: "n" }, `${e.tasks.closed}/${e.tasks.total}`),
          h("td", {}, e.open_pulls.map((p) => `#${p}`).join(" ") || "—"))))))];
  }

  // ---------------------------------------------------------------- draw

  function draw() {
    if (!model) return;
    const m = model, c = ctx(m), cur = route();
    const views = {
      overview: () => viewOverview(m, c),
      root: () => viewRoot(m, c, cur.arg, cur.sub),
      unattached: () => viewUnattached(m, c),
      findings: () => viewFindings(m, c),
      epics: () => viewEpics(m),
      prd: () => viewPrd(m, c, cur.arg),
    };
    const body = (views[cur.view] || views.overview)();
    const banner = m.tracker.ok ? null
      : h("div", { class: "banner" }, h("strong", {}, "Tracker unavailable: "), m.tracker.error || "unknown error", " — showing plan files only.");
    app.replaceChildren(h("div", { class: "shell" }, nav(m, c, cur), h("main", {}, banner, body)));
    document.title = `Pipeline · ${cur.view === "root" ? cur.arg : cur.view} · ${m.repo || ""}`;
    if (cur.view === "root" && cur.sub) document.getElementById(`phase-${cur.sub}`)?.scrollIntoView({ block: "start" });
  }

  function load(m) {
    if (!m || m.schema_version !== 1) {
      alert(`Expected pipeline-status JSON with schema_version 1${m && m.schema_version ? `, got ${m.schema_version}` : ""}. (A raw snapshot needs pipeline.py --snapshot-in first.)`);
      return;
    }
    model = m;
    draw();
  }

  function readFile(file) {
    file.text().then((t) => load(JSON.parse(t))).catch((err) => alert(`Could not read ${file.name}: ${err.message}`));
  }

  function showLoader() {
    const input = h("input", { type: "file", accept: ".json,application/json", onchange: (ev) => ev.target.files[0] && readFile(ev.target.files[0]) });
    const box = h("div", { class: "loader" },
      h("h1", {}, "Pipeline status"),
      h("p", { class: "sub" }, "Drop a pipeline-status JSON file here, or choose one."),
      input,
      h("p", { class: "muted mono" }, "python3 pipeline.py --format html --out pipeline.html"));
    box.addEventListener("dragover", (ev) => { ev.preventDefault(); box.classList.add("drag"); });
    box.addEventListener("dragleave", () => box.classList.remove("drag"));
    box.addEventListener("drop", (ev) => { ev.preventDefault(); box.classList.remove("drag"); ev.dataTransfer.files[0] && readFile(ev.dataTransfer.files[0]); });
    app.replaceChildren(box);
  }

  window.addEventListener("hashchange", () => { window.scrollTo(0, 0); draw(); });

  const theme = localStorage.getItem("pipeline:theme");
  if (theme && theme !== "auto") document.documentElement.setAttribute("data-theme", theme);

  const raw = document.getElementById("pipeline-data").textContent.trim();
  if (raw && !raw.startsWith("__PIPELINE_JSON")) load(JSON.parse(raw));
  else showLoader();
})();
</script>
</body>
</html>
